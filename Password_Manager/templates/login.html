{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:420px;margin:4rem auto;padding:0 1.5rem">
  <div class="card">
    <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:.3rem">Login to Vault</h2>
    <p style="color:var(--dim);font-size:.82rem;margin-bottom:1.8rem">
      Your master password derives the encryption key used to unlock your vault.
    </p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Your username" required autofocus/>
      </div>
      <div class="form-group">
        <label>Master Password</label>
        <input type="password" name="master_password" placeholder="Your master password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">
        Unlock Vault
      </button>
    </form>

    <p style="text-align:center;margin-top:1.2rem;font-size:.82rem;color:var(--dim)">
      No account? <a href="{{ url_for('register') }}">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
